name: Deploy site

# Every push to main runs the full CI suite first and only deploys if it passes.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild so time-based text stays true without a push: Experience durations
  # ("1 yr 2 mos") and Current / Upcoming tags are computed at build time.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nilaygautam.com
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=@nilaygautam/site

      # Keep the wrangler version in sync with the dry run in ci.yml.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm dlx wrangler@4.161.0 deploy
