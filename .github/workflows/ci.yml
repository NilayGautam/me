name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, E2E, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

      - name: Install Playwright browser
        run: pnpm --filter @nilaygautam/site exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm turbo run e2e

      - name: Lighthouse
        run: |
          export CHROME_PATH="$(pnpm --filter @nilaygautam/site exec node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm --filter @nilaygautam/site run lighthouse

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            apps/site/playwright-report
            apps/site/test-results
            apps/site/.lighthouseci
          retention-days: 7
